<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#1e3a5f"/>
  <!-- Airplane silhouette (top-down view) -->
  <g fill="#ffffff" transform="translate(256,256)">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="22" ry="120"/>
    <!-- Wings -->
    <ellipse cx="0" cy="-10" rx="170" ry="22" transform="rotate(-2)"/>
    <!-- Tail horizontal stabilizer -->
    <ellipse cx="0" cy="100" rx="75" ry="13"/>
    <!-- Tail vertical fin -->
    <ellipse cx="0" cy="95" rx="10" ry="30"/>
    <!-- Engine nacelles -->
    <ellipse cx="-90" cy="-10" rx="14" ry="28"/>
    <ellipse cx="90" cy="-10" rx="14" ry="28"/>
    <!-- Prop spinners -->
    <circle cx="-90" cy="-36" r="7"/>
    <circle cx="90" cy="-36" r="7"/>
  </g>
  <!-- CG cross-hair accent -->
  <circle cx="256" cy="246" r="8" fill="#f59e0b" opacity="0.9"/>
</svg>

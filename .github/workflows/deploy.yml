name: Deploy to seedbox

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Write deploy key
        env:
          DEPLOY_KEY: ${{ secrets.SEEDBOX_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to seedbox
        run: |
          rsync -az --delete \
            --rsync-path="mkdir -p /home/jackbr4/apps/janskiairplane/dist && rsync" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes" \
            dist/ jackbr4@narvi.whatbox.ca:/home/jackbr4/apps/janskiairplane/dist/

      - name: Verify the live site is actually this app
        run: |
          url=http://narvi.whatbox.ca:8790
          body=$(curl -fsS --retry 3 --retry-delay 2 "$url/")

          # A 200 alone is not proof: a stale placeholder also returns 200.
          # Assert the served page is really this build.
          if ! grep -q "Topaz W&B Calculator" <<<"$body"; then
            echo "::error::$url/ returned 200 but is not this app. Served:"
            echo "$body" | head -20
            exit 1
          fi

          curl -fsS -o /dev/null "$url/manifest.webmanifest"
          echo "✓ $url/ is serving this build (index + manifest OK)"

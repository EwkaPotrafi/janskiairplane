name: Deploy to seedbox

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      # Fail with something readable rather than an opaque ssh error.
      - name: Check the deploy key is configured
        env:
          DEPLOY_KEY: ${{ secrets.TOPAZ_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Secret TOPAZ_DEPLOY_KEY is not set on this repository."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

      - name: Write deploy key
        env:
          DEPLOY_KEY: ${{ secrets.TOPAZ_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Prints only the fingerprint and key type, never the key itself.
          # Compare against `ssh-keygen -lf ~/.ssh/authorized_keys` on the
          # server to confirm the matching public key is installed.
          echo "Deploy key fingerprint:"
          ssh-keygen -l -f ~/.ssh/deploy_key || {
            echo "::error::Key is malformed - ssh cannot parse it."; exit 1; }

      # This app now has its own key, directory and port on the seedbox, and
      # that directory is the nginx root, so the archive must extract flat with
      # index.html at its top level. A wrapper directory would put index.html
      # one level below the root and the site would 403.
      - name: Check the archive extracts flat
        run: |
          tar -czf /tmp/deploy.tar.gz -C dist .
          echo "Archive top level:"; tar -tzf /tmp/deploy.tar.gz | grep -v '/.\+/' | sed 's/^/  /'
          if ! tar -tzf /tmp/deploy.tar.gz | grep -qx './index.html'; then
            echo "::error::index.html is not at the top level of the archive."
            exit 1
          fi
          echo "✓ index.html is at the archive root"

      # The deploy key on the seedbox is restricted to a forced command
      # (command="..." in authorized_keys) that extracts a gzipped tarball
      # from stdin into the web directory. It ignores any command we ask for,
      # so rsync cannot work here: the server runs tar rather than
      # `rsync --server`, no rsync protocol greeting ever arrives, and the
      # client waits forever. Piping a tarball in is the supported interface.
      - name: Deploy to seedbox
        run: |
          tar -czf - -C dist . | timeout 300 ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            jackbr4@narvi.whatbox.ca
          echo "Tarball sent ($(du -sh dist | cut -f1) uncompressed)."

      - name: Verify the live site is actually this app
        run: |
          url=http://narvi.whatbox.ca:8791
          body=$(curl -fsS --retry 3 --retry-delay 2 "$url/")

          # A 200 alone is not proof: a stale placeholder also returns 200.
          # Assert the served page is really this build.
          if ! grep -q "Topaz W&B Calculator" <<<"$body"; then
            echo "::error::$url/ returned 200 but is not this app. Served:"
            echo "$body" | head -20
            exit 1
          fi

          curl -fsS -o /dev/null "$url/manifest.webmanifest"
          echo "✓ $url/ is serving this build (index + manifest OK)"
